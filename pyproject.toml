[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lgtvcompanion"
version = "0.2.3"
description = "Keep LG webOS TVs in sync with your Linux PC's power state — a Linux port of JPersson77/LGTVCompanion"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Mo" }]
keywords = ["lg", "webos", "tv", "wake-on-lan", "htpc", "ssap"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: No Input/Output (Daemon)",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dependencies = [
    "websockets>=13",
    "dbus-fast>=2.24",
]

[project.optional-dependencies]
tray = ["PySide6>=6.7"]
mqtt = ["aiomqtt>=2"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "pytest-timeout>=2", "ruff>=0.6", "mypy>=1.11", "aiomqtt>=2"]

[project.scripts]
lgtvc = "lgtvcompanion.cli.main:main"
lgtvc-daemon = "lgtvcompanion.daemon.main:main"
lgtvc-agent = "lgtvcompanion.agent.main:main"
lgtvc-tray = "lgtvcompanion.tray.app:main"
lgtvc-mqtt = "lgtvcompanion.mqtt.main:main"

[project.urls]
Homepage = "https://github.com/moyoseph/lgtv-companion-linux"
Repository = "https://github.com/moyoseph/lgtv-companion-linux"
Issues = "https://github.com/moyoseph/lgtv-companion-linux/issues"
Changelog = "https://github.com/moyoseph/lgtv-companion-linux/blob/main/CHANGELOG.md"
Funding = "https://buymeacoffee.com/moyoseph"
"Upstream (Windows)" = "https://github.com/JPersson77/LGTVCompanion"

[tool.hatch.build.targets.wheel]
packages = ["src/lgtvcompanion"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 60

[tool.coverage.report]
# The coverage/badges CI job installs PySide6 ([tray]) + dbusmock and runs
# under an offscreen QApplication + dbus-run-session, so tray/settings.py and
# the D-Bus binding tests are exercised there. tray/app.py:main() (the Qt
# event-loop shell) keeps a narrow `# pragma: no cover`.
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP", "SIM", "B"]
ignore = ["SIM105"]

[tool.ruff.lint.per-file-ignores]
# dbus-fast encodes D-Bus signatures in string return annotations (-> "b");
# they must stay quoted strings and are not real type annotations.
"tests/dbus_mocks.py" = ["UP037", "F821", "F722"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
