[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lgtvcompanion"
version = "0.1.0"
description = "Keep LG webOS TVs in sync with your Linux PC's power state — a Linux port of JPersson77/LGTVCompanion"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Mo" }]
keywords = ["lg", "webos", "tv", "wake-on-lan", "htpc", "ssap"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: No Input/Output (Daemon)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]
dependencies = [
    "websockets>=13",
    "dbus-fast>=2.24",
]

[project.optional-dependencies]
tray = ["PySide6>=6.7"]
mqtt = ["aiomqtt>=2"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "aiomqtt>=2"]

[project.scripts]
lgtvc = "lgtvcompanion.cli.main:main"
lgtvc-daemon = "lgtvcompanion.daemon.main:main"
lgtvc-agent = "lgtvcompanion.agent.main:main"
lgtvc-tray = "lgtvcompanion.tray.app:main"
lgtvc-mqtt = "lgtvcompanion.mqtt.main:main"

[project.urls]
Homepage = "https://github.com/moyoseph/lgtv-companion-linux"
Repository = "https://github.com/moyoseph/lgtv-companion-linux"
Issues = "https://github.com/moyoseph/lgtv-companion-linux/issues"
Changelog = "https://github.com/moyoseph/lgtv-companion-linux/blob/main/CHANGELOG.md"
"Upstream (Windows)" = "https://github.com/JPersson77/LGTVCompanion"

[tool.hatch.build.targets.wheel]
packages = ["src/lgtvcompanion"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP", "SIM", "B"]
ignore = ["SIM105"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
