name: lgtvcompanion
arch: all
platform: linux
version: ${VERSION}
maintainer: "moyoseph <moyoseph@users.noreply.github.com>"
description: |
  Keep LG webOS TVs in sync with your Linux PC's power state: automatic power
  on/off with boot/shutdown/suspend/resume, idle screen blanking, HDMI input
  management, Wake-on-LAN, and a full CLI. A Linux port of JPersson77's
  LGTVCompanion.
vendor: "moyoseph"
homepage: "https://github.com/moyoseph/lgtv-companion-linux"
license: "MIT"
section: utils
priority: optional

# Pure-Python payload runs on the system interpreter (>= 3.11).
depends:
  - "python3 (>= 3.11)"
overrides:
  rpm:
    depends:
      - "python3 >= 3.11"
  archlinux:
    depends:
      - "python>=3.11"

contents:
  - src: ./build/pkgroot/opt/lgtv-companion/lib
    dst: /opt/lgtv-companion/lib
  - src: ./packaging/bin/lgtvc
    dst: /usr/bin/lgtvc
    file_info:
      mode: 0755
  - src: ./packaging/systemd/lgtvc-daemon.service
    dst: /usr/lib/systemd/system/lgtvc-daemon.service
  - src: ./packaging/systemd/lgtvc-shutdown.service
    dst: /usr/lib/systemd/system/lgtvc-shutdown.service
  - src: ./packaging/systemd/lgtvc-sleep.service
    dst: /usr/lib/systemd/system/lgtvc-sleep.service
  - src: ./packaging/systemd/user/lgtvc-agent.service
    dst: /usr/lib/systemd/user/lgtvc-agent.service
  - dst: /etc/lgtv-companion
    type: dir
    file_info:
      mode: 0755
  - dst: /var/lib/lgtv-companion
    type: dir
    file_info:
      mode: 0755

scripts:
  postinstall: ./packaging/scripts/postinstall.sh
  preremove: ./packaging/scripts/preremove.sh
  postremove: ./packaging/scripts/postremove.sh
