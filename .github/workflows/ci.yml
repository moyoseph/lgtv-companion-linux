name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install (with dev extras)
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e '.[dev]'
      - name: Ruff
        run: uv run ruff check src tests
      - name: Mypy
        run: uv run mypy src || true   # advisory until fully typed
      - name: Pytest
        run: uv run pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Build wheel + sdist
        run: uv build
      - name: Verify vendored data is packaged
        run: |
          python - <<'PY'
          import zipfile, glob
          w = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(w).namelist()
          need = ["lgtvcompanion/data/lg_api_commands.json",
                  "lgtvcompanion/data/lg_api_buttons.json"]
          missing = [n for n in need if n not in names]
          assert not missing, f"missing from wheel: {missing}"
          print("wheel OK:", *need)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  packages:
    # Build the .deb/.rpm/Arch packages and install-smoke-test each in its
    # native container: `lgtvc --help`, units present, the vendored MQTT bridge
    # imports, and the distro PySide6 dependency actually resolved (tray works).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Build packages
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          export PATH="$PATH:$(go env GOPATH)/bin"
          VER="$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')"
          VERSION="$VER" packaging/build.sh
          ls -1 dist-pkg/
      - name: Smoke-test .deb (Ubuntu)
        run: |
          docker run --rm -v "$PWD/dist-pkg:/pkg:ro" ubuntu:24.04 bash -eux -c '
            apt-get update -qq
            echo "available pyside6 packages:"; apt-cache search pyside6 || true
            apt-get install -y /pkg/lgtvcompanion_*_all.deb
            lgtvc --help >/dev/null
            test -f /usr/lib/systemd/system/lgtvc-daemon.service
            test -f /usr/lib/systemd/user/lgtvc-tray.service
            test -f /usr/share/icons/hicolor/scalable/apps/lgtvcompanion.svg
            python3 -c "import PySide6.QtWidgets"
            PYTHONPATH=/opt/lgtv-companion/lib python3 -c "import aiomqtt, lgtvcompanion.mqtt.main, lgtvcompanion.tray.app"
          '
      - name: Smoke-test .rpm (Fedora)
        run: |
          docker run --rm -v "$PWD/dist-pkg:/pkg:ro" fedora:latest bash -eux -c '
            echo "available pyside6 packages:"; dnf -q search pyside6 2>/dev/null || true
            dnf install -y -q /pkg/lgtvcompanion-*.noarch.rpm
            lgtvc --help >/dev/null
            python3 -c "import PySide6.QtWidgets"
            PYTHONPATH=/opt/lgtv-companion/lib python3 -c "import aiomqtt, lgtvcompanion.mqtt.main"
          '
      - name: Smoke-test Arch package
        run: |
          docker run --rm -v "$PWD/dist-pkg:/pkg:ro" archlinux:latest bash -eux -c '
            pacman -Sy --noconfirm >/dev/null
            echo "available pyside6 packages:"; pacman -Ss pyside6 || true
            pacman -U --noconfirm /pkg/lgtvcompanion-*-any.pkg.tar.zst
            lgtvc --help >/dev/null
            python3 -c "import PySide6.QtWidgets"
            PYTHONPATH=/opt/lgtv-companion/lib python3 -c "import aiomqtt, lgtvcompanion.mqtt.main"
          '

  badges:
    # The "full" coverage job: installs the tray (PySide6) + D-Bus system libs
    # and runs the whole suite under an offscreen QApplication and a real
    # session bus (dbus-run-session), so the Qt UI and D-Bus binding tests are
    # exercised and counted. Recomputes the badges and publishes them to the
    # `badges` branch. Only on green pushes to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Install system libs (Qt offscreen + D-Bus)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 fontconfig dbus dbus-x11
      - name: Install (with tray extra)
        run: |
          uv venv
          uv pip install -e '.[dev,tray]'
      - name: Compute coverage + test count (offscreen Qt + real D-Bus)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dbus-run-session -- uv run pytest -q \
            --cov=lgtvcompanion --cov-report=json:coverage.json
          n=$(uv run pytest --collect-only -q | grep -cE '::')
          uv run python scripts/gen_badges.py coverage.json "$n" badges-out
      - name: Publish to badges branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tmp="$(mktemp -d)"
          cp badges-out/coverage.json badges-out/tests.json "$tmp/"
          cd "$tmp"
          git init -q
          git checkout -q -b badges
          git add coverage.json tests.json
          git commit -q -m "chore: update badges [skip ci]"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
