name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install (with dev extras)
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e '.[dev]'
      - name: Ruff
        run: uv run ruff check src tests
      - name: Mypy
        run: uv run mypy src || true   # advisory until fully typed
      - name: Pytest
        run: uv run pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Build wheel + sdist
        run: uv build
      - name: Verify vendored data is packaged
        run: |
          python - <<'PY'
          import zipfile, glob
          w = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(w).namelist()
          need = ["lgtvcompanion/data/lg_api_commands.json",
                  "lgtvcompanion/data/lg_api_buttons.json"]
          missing = [n for n in need if n not in names]
          assert not missing, f"missing from wheel: {missing}"
          print("wheel OK:", *need)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
